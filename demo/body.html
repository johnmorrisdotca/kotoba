      <section class="setup" aria-labelledby="setup-title">
        <h2 id="setup-title" class="fam-sr" data-say="pageSetup"></h2>
        <div class="fam-row" data-help-en="Which language the secret word is in: English, French, German, or Japanese kana. Choosing one loads its words and starts a new word." data-help-ja="秘密の単語の言語です（英語、フランス語、ドイツ語、日本語のかな）。選ぶとその言語の単語を読み込み、新しい単語を始めます。">
          <span class="fam-label" id="lang-label" data-say="pageLanguage"></span>
          <div class="fam-seg" id="languages" role="group" aria-labelledby="lang-label" data-testid="languages">
            <button type="button" data-lang-id="en" aria-pressed="true" lang="en">English</button>
            <button type="button" data-lang-id="fr" aria-pressed="false" lang="fr">Français</button>
            <button type="button" data-lang-id="de" aria-pressed="false" lang="de">Deutsch</button>
            <button type="button" data-lang-id="ja" aria-pressed="false" lang="ja">かな</button>
          </div>
        </div>
        <div class="fam-row" data-help-en="Length is how many letters (or kana) the word has. Easy words picks only from a shorter list of everyday words. New word starts another word." data-help-ja="「長さ」は単語の文字数（かなの数）です。「やさしい単語」は、日常的な短いリストの単語だけから選びます。「新しい単語」で別の単語を始めます。">
          <span class="fam-label" id="size-label" data-say="pageLength"></span>
          <div class="fam-seg" id="sizes" role="group" aria-labelledby="size-label" data-testid="sizes"></div>
          <button type="button" class="fam-button" id="easy" aria-pressed="false" data-testid="easy" data-say="pageEasy"></button>
          <button type="button" class="fam-button" id="daily" aria-pressed="false" data-testid="daily" data-say="pageDaily" data-tip-en="Today's word: the same one for everybody, and it changes at midnight UTC" data-tip-ja="今日の単語です。誰にとっても同じで、UTCの午前0時に変わります"></button>
          <button type="button" class="fam-button" data-primary="true" id="new" data-testid="new" data-say="pageNew"></button>
        </div>
      </section>

      <section class="fam-felt game" aria-label="Game" data-testid="game">
        <div id="board" data-testid="board"></div>
      </section>
