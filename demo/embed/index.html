<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Kotoba · word game</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}kotoba-game{max-height:100%}</style></head><body><script type="module">
import "../dist/element-define.js";
import { WORD_LIST_NAMES, WORD_LIST_SIZES } from "../dist/load.js";
import { embedDay } from "../dist/embed-day.js";
const query=new URLSearchParams(location.search),game=document.createElement("kotoba-game");game.setAttribute("size","medium");
const words=WORD_LIST_NAMES.includes(query.get("words"))?query.get("words"):"en";game.setAttribute("words",words);const letters=Number(query.get("letters"));if(WORD_LIST_SIZES[words].includes(letters))game.setAttribute("letters",String(letters));
for(const[name,choices]of[["size",["small","medium","large"]],["theme",["auto","light","dark"]],["lang",["en","ja"]]])if(choices.includes(query.get(name)))game.setAttribute(name,query.get(name));
for(const[name,min,max]of[["width",100,2000],["rows",1,12],["seed",0,4294967295]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)game.setAttribute(name,value);}
for(const name of["easy","keyboard"])if(query.has(name)&&["","true","on","1","false","off","no","0"].includes(query.get(name).toLowerCase()))game.setAttribute(name,query.get(name));
if(query.has("daily"))try{embedDay(query.get("daily"));game.setAttribute("daily",query.get("daily"));}catch{/* Ignore an invalid day. */}
const label=query.get("label");if(label!==null&&label.length<=200)game.setAttribute("label",label);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["kotoba-load","kotoba-error","kotoba-change","kotoba-finish"])game.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(game);
</script></body></html>
